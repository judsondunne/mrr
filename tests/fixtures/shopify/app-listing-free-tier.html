<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cart Rule Guard | Shopify App Store</title>
  <meta name="description" content="Free plan available. Simple cart rules for small stores.">
</head>
<body>
  <main>
    <section class="hero">
      <h1>Cart Rule Guard</h1>
      <div class="ui-star-rating" aria-label="4.2 out of 5 stars">&#9733;&#9733;&#9733;&#9733;</div>
      <a href="/cart-rule-guard/reviews">342 reviews</a>
    </section>

    <section class="app-details-description">
      <p>Cart Rule Guard blocks carts that break a rule. Free plan available for stores under 50 orders a month.</p>
    </section>

    <section id="pricing-plans">
      <h2>Pricing</h2>
      <div class="app-details-pricing-plan-card">
        <h3>Free</h3>
        <p class="app-details-pricing-plan-card__price">Free</p>
        <ul>
          <li>Up to 50 orders per month</li>
          <li>1 active rule</li>
        </ul>
      </div>
      <div class="app-details-pricing-plan-card">
        <h3>Growth</h3>
        <p class="app-details-pricing-plan-card__price">$19 / month</p>
        <ul>
          <li>Unlimited orders</li>
          <li>10 active rules</li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
